<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e5733">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="超市服务">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>超市客户服务</title>
<style>
/* ============ 设计变量 ============ */
:root{
  --bg:#F2F6F1;
  --surface:#FFFFFF;
  --line:#DCE6DA;
  --ink:#1E2A23;
  --ink-2:#5B6B60;
  --ink-3:#8B9A8F;
  --green:#177245;
  --green-dark:#0E5733;
  --green-soft:#E5F1E9;
  --orange:#D9660C;
  --orange-soft:#FCEFDF;
  --teal:#0F766E;
  --teal-soft:#E1F1EE;
  --red:#C0392B;
  --red-soft:#F9E9E6;
  --amber:#B45309;
  --amber-soft:#FCF0DC;
  --radius:16px;
  --shadow:0 1px 2px rgba(15,42,30,.04), 0 12px 32px -16px rgba(15,42,30,.25);
  --shadow-lg:0 2px 6px rgba(15,42,30,.06), 0 24px 48px -20px rgba(15,42,30,.32);
  --grad-primary:linear-gradient(135deg,#1F8A55 0%,#0E5733 100%);
  --grad-hero:linear-gradient(135deg,#0E5733 0%,#177245 55%,#0F766E 100%);
  --grad-soft:linear-gradient(180deg,#F2F6F1 0%,#E9F1EC 100%);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:linear-gradient(180deg,#0a0e24 0%,#121a3a 48%,#1c2650 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
#starfield{position:fixed;inset:0;z-index:-1;display:block;pointer-events:none}
#app{max-width:1080px;margin:0 auto;padding:18px 20px 60px}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
h1,h2,h3{margin:0;line-height:1.25}
a{color:var(--green)}
.num{font-variant-numeric:tabular-nums}

/* ============ 顶栏与品牌 ============ */
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:4px 0 14px}
.brand{font-size:26px;font-weight:800;letter-spacing:.2px;color:#F6E7B8;text-shadow:0 2px 14px rgba(246,231,184,.25)}
.brand-sub{color:rgba(255,255,255,.72);font-size:13px;margin-top:3px}
.topbar-right{display:flex;gap:8px;flex-shrink:0}
.barcode{height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,#F6E7B8 0 14px,rgba(255,255,255,.85) 14px 18px,rgba(255,255,255,.25) 18px 26px);margin-bottom:22px;opacity:.9}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}

/* ============ 按钮 ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:11px;padding:10px 16px;font-size:15px;font-weight:600;transition:background .12s ease,transform .1s ease}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--grad-primary);color:#fff;box-shadow:0 8px 18px -8px rgba(14,87,51,.55)}
.btn-primary:hover{background:linear-gradient(135deg,#1c7a4c 0%,#0c4a2b 100%);box-shadow:0 10px 22px -8px rgba(14,87,51,.6)}
.btn-primary:disabled{opacity:.55;cursor:default}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--green);color:var(--green)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-danger:hover{background:#F3DCD8}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:9px}
.link-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--ink-2);font-size:13px;padding:6px 8px;border-radius:8px}
.link-btn:hover{color:var(--green);background:var(--green-soft)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:9px;color:var(--ink-2)}
.icon-btn:hover{color:var(--green);border-color:var(--green)}
svg{display:block;flex-shrink:0}

/* ============ 卡片 ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}

/* ============ 首页模块卡 ============ */
.home-main{margin-top:6px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.module-card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;cursor:pointer;transition:transform .14s ease,box-shadow .14s ease;display:flex;flex-direction:column;gap:10px}
.module-card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--grad-primary);opacity:.85}
.module-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.module-card:focus-visible{outline:3px solid var(--green-soft);outline-offset:2px}
.mc-icon{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.mc-icon.green{background:linear-gradient(135deg,#E5F1E9,#CDE6D6);color:var(--green)}
.mc-icon.orange{background:linear-gradient(135deg,#FCEFDF,#F8DDBB);color:var(--orange)}
.mc-icon.teal{background:linear-gradient(135deg,#E1F1EE,#C4E6E0);color:var(--teal)}
.mc-title{font-size:20px;font-weight:800;color:var(--ink)}
.mc-desc{color:var(--ink-2);font-size:14px;min-height:40px}
.mc-stat{font-size:13px;color:var(--ink-3)}
.mc-go{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:600;font-size:14px}
.home-foot{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:6px}
.foot-note{font-size:12px;color:rgba(255,255,255,.6)}

/* ===== 白天主题（柔和护眼风景） ===== */
body.day{background:linear-gradient(180deg,#cfe6f5 0%,#e7f1e3 55%,#d4e7cc 100%)}
body.day .brand{color:#2f6b4f;text-shadow:none}
body.day .brand-sub{color:#4a5d52}
body.day .foot-note{color:#5a6b60}
body.day .barcode{background:repeating-linear-gradient(90deg,#2f6b4f 0 14px,#1f8a55 14px 18px,#cde6d6 18px 26px);opacity:1}
body.night .barcode{opacity:.9}

/* ============ 工具栏 / 搜索 ============ */
.toolbar{padding:14px 16px;margin-bottom:18px;display:flex;flex-direction:column;gap:12px}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap svg{position:absolute;left:12px;color:var(--ink-3);pointer-events:none}
.search-wrap input{width:100%;padding:11px 12px 11px 40px;border:1px solid var(--line);border-radius:11px;font-size:16px;background:var(--surface);color:var(--ink)}
.search-wrap input:focus{outline:2px solid var(--green-soft);border-color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:14px}
.chip:hover{border-color:var(--green);color:var(--green)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.sort-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sort-row select{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:14px;color:var(--ink)}
.count{font-size:13px;color:var(--ink-3)}

/* ============ 商品网格 ============ */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px}
.prod-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:transform .12s ease}
.prod-card:hover{transform:translateY(-2px)}
.prod-img{height:150px;background:linear-gradient(135deg,#E5F1E9,#D3E8DB);display:grid;place-items:center;overflow:hidden}
.prod-img img{width:100%;height:100%;object-fit:cover;display:block}
.prod-img .ph{color:var(--ink-3);opacity:.7}
.prod-body{padding:13px 14px 15px;display:flex;flex-direction:column;gap:7px;flex:1}
.prod-name{font-weight:700;font-size:15px;line-height:1.35}
.prod-cat{font-size:12px;color:var(--ink-3)}
.prod-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.price-tag{display:inline-flex;align-items:baseline;gap:3px;background:linear-gradient(135deg,#FCEFDF,#FADFBE);color:var(--orange);font-weight:800;font-size:16px;padding:4px 10px;border-radius:9px;box-shadow:inset 0 0 0 1px rgba(217,102,12,.15)}
.price-tag .cur{font-size:11px;font-weight:600}
.price-tag .unit{font-size:12px;font-weight:600;opacity:.75}

/* ===== 闲鱼风 二手寄售卡片 ===== */
.xy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.xy-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.xy-card:hover{transform:translateY(-2px)}
.xy-img{position:relative;aspect-ratio:1/1;background:#f1f3f5;display:grid;place-items:center;overflow:hidden}
.xy-img img{width:100%;height:100%;object-fit:cover;display:block}
.xy-img .ph{color:#adb5bd}
.xy-sold{position:absolute;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;letter-spacing:4px}
.xy-status{position:absolute;left:8px;top:8px;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700;backdrop-filter:blur(4px)}
.xy-status.st-pending{background:rgba(255,159,67,.92);color:#fff}
.xy-status.st-sold{background:rgba(108,117,125,.85);color:#fff}
.xy-body{padding:9px 10px 11px;display:flex;flex-direction:column;gap:6px;flex:1}
.xy-title{font-size:13.5px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.xy-price{color:#ff2e4d;font-weight:800;font-size:19px;line-height:1;display:flex;align-items:baseline;gap:2px}
.xy-price .cur{font-size:12px;font-weight:700}
.xy-meta{display:flex;align-items:center;gap:6px;margin-top:auto}
.xy-avatar{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#ffd66b,#ff9f43);color:#7a4a00;font-size:10px;font-weight:700;display:grid;place-items:center;flex:0 0 auto}
.xy-seller{font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.xy-want{font-size:10.5px;color:#ff6b35;background:#fff1ea;border:1px solid #ffd6c2;border-radius:8px;padding:1px 7px;flex:0 0 auto}

/* ===== 闲鱼风 发布 圆形 + 悬浮按钮 ===== */
.xy-fab{position:fixed;right:20px;bottom:28px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#ffd66b,#ff9f43);color:#fff;display:grid;place-items:center;cursor:pointer;border:none;box-shadow:0 6px 18px rgba(255,159,67,.5);z-index:60;transition:transform .12s ease}
.xy-fab:hover{transform:scale(1.06)}
.xy-fab svg{width:28px;height:28px}
.xy-back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:7px 14px;cursor:pointer;margin-bottom:12px}
@media(max-width:600px){.xy-fab{right:16px;bottom:20px;width:54px;height:54px}}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.b-ok{background:var(--green-soft);color:var(--green)}
.b-no{background:var(--ink-3);color:#fff}
.b-wait{background:var(--orange-soft);color:var(--orange)}
.b-done{background:var(--green-soft);color:var(--green-dark)}
.b-review{background:#fff3cd;color:#b8860b;border:1px solid #ffe08a}
.badge.clickable{cursor:pointer;font:inherit;border:none}
.badge.clickable:active{transform:scale(.96)}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px}
.pager button[disabled]{opacity:.4;pointer-events:none}

/* ============ 空状态 ============ */
.empty{padding:56px 20px;text-align:center;color:var(--ink-2)}
.empty .e-ico{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
.empty h3{margin-bottom:6px;color:var(--ink);font-size:17px}
.empty p{margin:0;font-size:14px}

/* ============ 快递查询 ============ */
.p-search{display:flex;flex-direction:column;gap:14px;padding:22px}
.p-search h2{font-size:19px}
.query-row{display:flex;gap:10px}
.query-row .search-wrap{flex:1}
.query-row .btn{flex-shrink:0}
.p-result{padding:20px;margin-top:16px}
.p-status-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.p-status-row .badge{font-size:14px;padding:6px 14px}
.p-track{font-weight:800;font-size:17px}
.dl{display:grid;grid-template-columns:110px 1fr;gap:9px 14px;font-size:14px}
.dl dt{color:var(--ink-3)}
.dl dd{margin:0;color:var(--ink);font-weight:600}
.p-big-status{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}

/* ============ 汇率 ============ */
.rates-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px;margin-bottom:14px;flex-wrap:wrap}
.rates-head h2{font-size:19px;margin-bottom:4px}
.rates-meta{font-size:13px;color:var(--ink-2)}
.rate-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;margin-bottom:10px;flex-wrap:wrap}
.rate-code{display:flex;align-items:baseline;gap:9px}
.rate-code .c{font-weight:800;font-size:17px}
.rate-name{font-size:13px;color:var(--ink-3)}
.rate-val{font-size:15px;color:var(--ink-2)}
.rate-val .big{font-weight:800;color:var(--ink);font-size:18px}
.hint-bar{margin:12px 0;padding:11px 14px;border-radius:11px;font-size:13px}
.hint-amber{background:var(--amber-soft);color:var(--amber)}
.hint-green{background:var(--green-soft);color:var(--green-dark)}
.hint-red{background:var(--red-soft);color:var(--red)}
.rates-note{margin-top:14px;font-size:12px;color:var(--ink-3);text-align:center}
.conv-card{padding:18px 20px;margin-bottom:14px}
.conv-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.conv-head h3{font-size:17px}
.conv-note{font-size:12px;color:var(--ink-3)}
.conv-status{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.conv-status.ok{color:var(--green)}
.conv-status.warn{color:var(--amber)}
.conv-status.loading{color:var(--amber)}
.conv-status.off{color:var(--red);font-weight:700}
.conv-offline-card{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.conv-offnote{margin-top:10px;padding:9px 12px;border-radius:9px;background:var(--red-soft);color:var(--red);font-size:12px;font-weight:600}
.conv-grid{display:grid;grid-template-columns:1fr 1fr auto 1fr;gap:12px;align-items:end}
.conv-side label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.conv-side input,.conv-side select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--surface);color:var(--ink)}
.conv-side input:focus,.conv-side select:focus{outline:2px solid var(--green-soft);border-color:var(--green)}
.conv-swap{align-self:end;margin-bottom:2px}
.conv-result{margin-top:14px;padding:14px 16px;border-radius:12px;background:linear-gradient(135deg,#E5F1E9,#D6E9DD);color:var(--green-dark)}
.conv-line1{font-size:17px}
.conv-line1 .dim{color:var(--ink-2);font-weight:600}
.conv-line2{font-size:13px;opacity:.85;margin-top:3px}
.conv-none{color:var(--ink-3);font-size:14px}
.conv-hist-card{padding:16px 18px;margin-bottom:14px}
.hist-empty{color:var(--ink-3);font-size:14px;padding:10px 2px}
.hist-row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line)}
.hist-row:first-of-type{border-top:none}
.hist-info{flex:1;min-width:0}
.hist-main{font-size:15px;font-weight:700}
.hist-main b{color:var(--green-dark)}
.hist-sub{font-size:12px;color:var(--ink-3);margin-top:1px}
.loading-bar{height:4px;border-radius:2px;background:var(--green-soft);overflow:hidden;margin-bottom:12px}
.loading-bar::after{content:"";display:block;width:40%;height:100%;border-radius:2px;background:var(--green);animation:slide 1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}

/* ============ 管理模式 ============ */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px;box-shadow:var(--shadow)}
.tab{padding:9px 16px;border-radius:11px;border:none;background:transparent;color:var(--ink-2);font-size:14px;font-weight:600;transition:background .12s,color .12s}
.tab.on{background:var(--grad-primary);color:#fff;box-shadow:0 6px 14px -6px rgba(14,87,51,.6)}
.tab:hover:not(.on){background:var(--green-soft);color:var(--green)}
.admin-panel{padding:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.panel-head h3{font-size:17px}
.prow{display:flex;align-items:center;gap:14px;padding:12px 4px;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:none}
.prow-thumb{width:52px;height:52px;border-radius:10px;background:var(--green-soft);overflow:hidden;display:grid;place-items:center;flex-shrink:0}
.prow-thumb img{width:100%;height:100%;object-fit:cover}
.prow-thumb .ph{color:var(--ink-3);opacity:.7}
.prow-info{flex:1;min-width:0}
.prow-name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prow-sub{font-size:13px;color:var(--ink-2);margin-top:2px}
.prow-ops{display:flex;gap:8px;flex-shrink:0}

/* 快递列表：单号 / 尾号备注 / 时间 / 状态 / 取件编号 */
.p2{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--line)}
.p2-main{flex:1;min-width:0}
.p2-no{font-weight:700;font-size:15px;letter-spacing:.3px}
.p2-meta{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.p2-meta .tag{color:var(--ink-3)}
.p2-time{font-size:12px;color:var(--ink-2);text-align:center;line-height:1.45;flex:0 0 auto}
.p2-num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:0 0 auto;border:1.5px solid var(--green);color:var(--green-dark);background:var(--green-soft)}
.p2.off .p2-num{border-color:var(--line);color:var(--ink-3);background:transparent}
.p2-head{border-top:none;border-bottom:1px solid var(--line);padding:8px 4px}
.p2-head .p2-h{font-size:12px;color:var(--ink-3);font-weight:600}
.p2-head .p2-num{border:none;background:transparent}
.admin-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.admin-stack{display:flex;flex-direction:column;gap:16px}
@media (max-width:860px){.admin-grid2{grid-template-columns:1fr}}

/* ============ 表单 ============ */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input[type=text],.field input[type=number],.field input[type=password],.field select,.field input[type=datetime-local]{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--surface);color:var(--ink)
}
.field input:focus,.field select:focus{outline:2px solid var(--green-soft);border-color:var(--green)}
.field .hint{font-size:12px;color:var(--ink-3);margin-top:4px}
.radio-row{display:flex;gap:14px;padding-top:4px}
.radio-row label{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--ink);margin:0;cursor:pointer}
.check-row{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink);margin:4px 0}
.check-row input{width:17px;height:17px;accent-color:var(--green)}
.cur-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.cur-grid label{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--ink);cursor:pointer;padding:6px 8px;border:1px solid var(--line);border-radius:9px}
.cur-grid label:has(input:checked){border-color:var(--green);background:var(--green-soft)}
.cur-grid input{width:16px;height:16px;accent-color:var(--green)}
.save-row{display:flex;justify-content:flex-end;padding:14px 18px;margin-top:16px}

/* ============ 弹窗 ============ */
.mask{position:fixed;inset:0;background:rgba(14,32,24,.45);display:grid;place-items:center;z-index:60;padding:20px}
.modal{background:var(--surface);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:24px;box-shadow:0 24px 60px -20px rgba(0,0,0,.35)}
.modal h3{margin-bottom:16px;font-size:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.img-preview{max-width:140px;max-height:140px;border-radius:10px;border:1px solid var(--line);margin-bottom:10px;object-fit:cover}
.modal-warn{background:var(--amber-soft);color:var(--amber);font-size:13px;border-radius:10px;padding:10px 14px;margin-bottom:14px}

/* ============ Toast ============ */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;z-index:99;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);animation:rise .18s ease}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* ============ 响应式与无障碍 ============ */
@media (max-width:640px){
  #app{padding:14px 12px calc(60px + env(safe-area-inset-bottom))}
  .brand{font-size:22px}
  .prod-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .prod-img{height:120px}
  .query-row{flex-direction:column}
  .query-row .btn{width:100%}
  .prow{flex-wrap:wrap}
  .prow-ops{width:100%;justify-content:flex-end}
  .dl{grid-template-columns:92px 1fr}
  .modal{padding:18px}
  .conv-grid{grid-template-columns:1fr 1fr}
  .conv-swap{justify-self:end}
  /* 手机触控优化：按钮/输入至少 44px 高，易点按 */
  .btn{min-height:46px;font-size:16px}
  .icon-btn{width:44px;height:44px}
  .chip{padding:9px 14px;font-size:15px}
  .search-wrap input{padding:13px 12px 13px 40px;font-size:16px}
  .field input,.field select{min-height:46px;font-size:16px}
  .tab{padding:11px 14px;font-size:15px}
  .module-card{padding:20px}
  .mc-icon{width:58px;height:58px}
  .home-main{padding-top:4px}
}
@media (min-width:641px) and (max-width:1024px){
  .home-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
}
:focus-visible{outline:3px solid var(--green-soft);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function t(k){
  if(lang==='en' && onlineI18n[k]!=null && onlineI18n[k]!=='') return onlineI18n[k];
  const d = I18N[lang] || I18N.zh;
  return d[k] !== undefined ? d[k] : (I18N.zh[k] !== undefined ? I18N.zh[k] : k);
}
async function loadOnlineI18n(){
  if(lang!=='en') return;
  const entries = Object.entries(I18N.zh);
  const missing = entries.filter(([k,v])=>!onlineI18n[k]);
  if(!missing.length) return;
  const q = missing.map(([k,v])=>v).join('\n');
  try{
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=en&dt=t&q='+encodeURIComponent(q));
    const j = await r.json();
    const arr = (j[0]||[]).map(x=>x[0]||'');
    const translated = arr.join('\n').split('\n');
    missing.forEach(([k],i)=>{ if(translated[i]!=null && translated[i]!=='') onlineI18n[k]=translated[i]; });
    try{ localStorage.setItem('sm_i18n_en', JSON.stringify(onlineI18n)); }catch(e){}
    render();
  }catch(e){ /* 离线时保留中文/旧缓存 */ }
}

function readImage(file, cb){
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      let w=img.width, h=img.height, max=420;
      if(w>max){ h=Math.round(h*max/w); w=max; }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.72));
    };
    img.onerror = ()=>{ toast(lang==='zh'?'图片读取失败':'Image load failed'); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* ===== 路由 ===== */
function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const qi = h.indexOf('?');
  const name = qi>=0 ? h.slice(0,qi) : h;
  const params = qi>=0 ? new URLSearchParams(h.slice(qi+1)) : new URLSearchParams();
  return { name: name || 'home', params };
}
function go(hash){ if(location.hash===hash){ render(); } else { location.hash = hash; } }

/* ===== 页面渲染入口 ===== */
function render(){
  const r = route();
  const app = document.getElementById('app');
  const prevRoute = (window.__SM_ROUTE||'');
  const prevScroll = (window.__SM_SCROLL||0);
  document.title = t('appTitle');
  let html='';
  if(r.name==='admin' && !ADMIN_OK){
    html = viewHome();
    app.innerHTML = html;
    openLogin();
    return;
  }
  switch(r.name){
    case 'products': html = viewProducts(); break;
    case 'parcels':  html = viewParcels(); break;
    case 'consign':  html = viewConsign(); break;
    case 'admin':    html = viewAdmin((r.params.get('tab')||'products')); break;
    default:         html = viewHome();
  }
  app.innerHTML = html;
  if(r.name===prevRoute){ window.scrollTo(0, prevScroll); }
  else { window.scrollTo(0,0); }
  window.__SM_ROUTE = r.name;
  window.__SM_SCROLL = window.scrollY||0;
  afterRender(r);
}

function publicParcelList(){
  let list = S.parcels.slice().sort((a,b)=>(b.arrivalTime||'').localeCompare(a.arrivalTime||''));
  const total = list.length;
  if(PL.status && PL.status!=='all') list = list.filter(p=>p.status===PL.status);
  if(PL.q){
    const q = PL.q.trim().toLowerCase();
    list = list.filter(p=>{
      const no = (p.trackingNo||'').toLowerCase();
      const last4 = no.slice(-4);
      const name = (p.name||'').toLowerCase();
      const pick = (p.pickupNo||'').toLowerCase();
      return no.includes(q) || last4.includes(q) || name.includes(q) || pick===q || pick.includes(q);
    });
  }
  const chips = [['all',t('filterAll')],['pending',t('statusPending')],['picked',t('statusPicked')]]
    .map(x=>'<button class="chip '+(PL.status===x[0]?'on':'')+'" data-action="plist-filter" data-id="'+x[0]+'">'+esc(x[1])+'</button>').join('');
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if(PL.page > totalPages) PL.page = totalPages;
  if(PL.page < 1) PL.page = 1;
  const pageList = list.slice((PL.page-1)*PAGE_SIZE, PL.page*PAGE_SIZE);
  let rows;
  if(!list.length){
    rows = '<div class="empty" style="padding:22px 10px"><div class="e-ico">'+ICONS.box+'</div><p>'+esc(t('notFoundTitle'))+'</p></div>';
  }else{
    rows = pageList.map(p=>{
      let badge;
      if(p.status==='picked'){
        badge = '<span class="badge b-done">'+esc(t('statusPicked'))+'</span>';
      }else if(p.requested){
        badge = '<button class="badge b-review clickable" data-action="parcel-withdraw" data-id="'+esc(p.id)+'" title="'+esc(t('withdrawTip'))+'">'+esc(t('statusReview'))+'</button>';
      }else{
        badge = '<button class="badge b-wait clickable" data-action="parcel-request-pick" data-id="'+esc(p.id)+'" title="'+esc(t('requestPickTip'))+'">'+esc(t('statusPending'))+'</button>';
      }
      const off = p.status==='picked';
      const metaParts = [];
      if(p.note) metaParts.push(esc(p.note));
      if(p.name) metaParts.push(esc(p.name));
      const reqTimeCell = p.requestTime ? fmtShortDT(p.requestTime) : '—';
      return '<div class="p2'+(off?' off':'')+'">'+
        '<div class="p2-main">'+
          '<div class="p2-no num">'+esc(p.trackingNo)+'</div>'+
          (metaParts.length?'<div class="p2-meta">'+metaParts.join(' · ')+'</div>':'')+
        '</div>'+
        '<div class="p2-time">'+fmtShortDT(p.arrivalTime)+'</div>'+
        '<div class="p2-time num">'+reqTimeCell+'</div>'+
        badge+
        '<div class="p2-num">'+esc(p.pickupNo||'—')+'</div>'+
      '</div>';
    }).join('');
  }
  return '<div class="card admin-panel" style="margin-top:16px">'+
    '<div class="panel-head"><h3>'+esc(t('parcelAll'))+'</h3><span class="count num">'+esc(String(list.length))+' / '+esc(String(total))+'</span></div>'+
    '<div class="search-wrap" style="margin-bottom:8px">'+ICONS.search+'<input id="plist-search" data-action="plist-search" placeholder="'+esc(t('plistPh'))+'" value="'+esc(PL.q)+'"></div>'+
    '<div class="chips" style="margin-bottom:10px">'+chips+'</div>'+
    '<div class="p2 p2-head">'+
      '<div class="p2-main"><div class="p2-h">'+esc(t('trackingNo'))+'</div></div>'+
      '<div class="p2-time p2-h">'+esc(t('arrivalTime'))+'</div>'+
      '<div class="p2-time p2-h">'+esc(t('requestTime'))+'</div>'+
      '<div class="p2-h">'+esc(t('status'))+'</div>'+
      '<div class="p2-num p2-h">'+esc(t('parcelPickupNo'))+'</div>'+
    '</div>'+
    rows+
    pagerHtml(PL.page, totalPages, 'plist-page')+
  '</div>';
}

function saveProductFromForm(){
  const zh = document.getElementById('pi-zh').value.trim();
  const cat = document.getElementById('pi-cat').value;
  const price = parseFloat(document.getElementById('pi-price').value);
  const unit = document.getElementById('pi-unit').value.trim();
  const inStock = document.querySelector('input[name="pi-stock"]:checked').value === '1';
  if(!zh){ toast(t('requireName')); return; }
  if(isNaN(price) || price<0){ toast(t('requirePrice')); return; }
  if(FORM_PRODUCT_ID){
    const p = S.products.find(x=>x.id===FORM_PRODUCT_ID);
    if(p){ p.nameZh=zh; p.categoryId=cat; p.price=price; p.unit=unit; p.inStock=inStock; p.img=pendingImg; }
  }else{
    S.products.push({id:uid(), nameZh:zh, nameEn:'', categoryId:cat, price:price, unit:unit, inStock:inStock, img:pendingImg});
  }
  if(!saveProducts()){ toast(t('storageError')); return; }
  closeModal();
  render();
  toast(t('saved'));
}

function pagerHtml(page, total, act){
  if(total<=1) return '';
  const btns = [];
  btns.push('<button class="btn btn-ghost btn-sm" '+(page<=1?'disabled':'')+' data-action="'+act+'" data-id="'+(page-1)+'">'+esc(t('prevPage'))+'</button>');
  btns.push('<span class="count num" style="align-self:center">'+esc(page)+' / '+esc(total)+'</span>');
  btns.push('<button class="btn btn-ghost btn-sm" '+(page>=total?'disabled':'')+' data-action="'+act+'" data-id="'+(page+1)+'">'+esc(t('nextPage'))+'</button>');
  return '<div class="pager">'+btns.join('')+'</div>';
}

  const timeVal = document.getElementById('pa-time').value;
  const quick = document.getElementById('pa-quick').checked;
  if(!no){ toast(t('requireTracking')); return; }
  if(S.parcels.some(p=>p.trackingNo.toUpperCase()===no)){ toast(t('dupTracking')); return; }
  const arrivalTime = timeVal ? new Date(timeVal).toISOString() : new Date().toISOString();
  S.parcels.push({id:uid(), trackingNo:no, name:name, note:note, pickupNo:pickupNo, arrivalTime:arrivalTime, status:'pending', pickTime:null});
  if(!saveParcels()){ toast(t('storageError')); return; }
  if(quick){ document.getElementById('pa-no').value=''; }
  else{ ['pa-no','pa-name','pa-note','pa-pickupno'].forEach(id=>{ const e=document.getElementById(id); if(e) e.value=''; }); }
  render();
  toast(t('parcelAdded'));
}

/* ===== 备份 ===== */
function exportData(){
  const data = { app:'supermarket-customer-service', version:1, exportedAt:new Date().toISOString(),
    settings:S.settings, products:S.products, parcels:S.parcels, consign:S.consign };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const d=new Date(); a.download = 'supermarket-backup-'+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  toast(t('saved'));
}
function importData(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data || typeof data!=='object' || !data.settings || !Array.isArray(data.products) || !Array.isArray(data.parcels)) throw new Error('bad');
      const merged = Object.assign({}, defaultSettings(), data.settings);
      S.settings = merged; S.products = data.products; S.parcels = data.parcels;
      S.consign = Array.isArray(data.consign) ? data.consign : [];
      lang = (merged.lang==='en')?'en':'zh';
      saveSettings(); saveProducts(); saveParcels(); saveConsign();
      render();
      toast(t('importSuccess'));
    }catch(e){
      toast(t('importFail'));
    }
  };
  reader.readAsText(file);
}

/* ===== 动作分发（点击 / 回车统一入口） ===== */
function runAction(action, id, el){

    case 'go': go('#/'+id); break;

    case 'toggle-lang':
      lang = lang==='zh' ? 'en' : 'zh';
      S.settings.lang = lang;
      saveSettings();
      render();
      if(lang==='en') loadOnlineI18n();
      break;

      S.settings.theme = (S.settings.theme==='day') ? 'night' : 'day';

      if(ADMIN_OK){ go('#/admin'); } else { openLogin(); }

    }
    case 'cat-add': {
      const zh = document.getElementById('cat-new-zh').value.trim();
      if(!zh){ toast(t('catEmpty')); break; }
      S.settings.categories.push({id:uid(), zh:zh, en:zh});
      saveSettings(); render(); toast(t('saved'));
      break;
    }
    case 'cat-save': {
      const zh = document.getElementById('cat-zh-'+id).value.trim();
      const c = S.settings.categories.find(x=>x.id===id);
      if(c && zh){ c.zh = zh; c.en = zh; saveSettings(); render(); toast(t('saved')); }
      break;
    }
    case 'cat-del': {
      const used = S.products.some(p=>p.categoryId===id);
      if(used){ toast(t('catInUse')); break; }
      S.settings.categories = S.settings.categories.filter(c=>c.id!==id);
      saveSettings(); render(); toast(t('deleted'));
      break;
    }
    case 'backup-export': exportData(); break;
    case 'backup-import': { const f=document.getElementById('imp-file'); if(f) f.click(); break; }
  }
}

/* 点击委托 */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  runAction(el.getAttribute('data-action'), el.getAttribute('data-id')||'', el);
});
/* 回车委托 */
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  const t = e.target;
  const act = t && t.getAttribute && t.getAttribute('data-enter');
  if(act){ e.preventDefault(); runAction(act, t.getAttribute('data-id')||'', t); }
});
/* 文件选择 */
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.id==='pi-file'){
    const f = t.files && t.files[0];
    if(f) readImage(f, d=>{
      pendingImg = d;
      const p = document.getElementById('pi-prev');
      if(p){ p.src=d; p.style.display='block'; }
      const b = document.querySelector('[data-action="prod-img-clear"]');
      if(b) b.style.display='inline-flex';
    });
    t.value='';
  }else if(t.id==='cs-file'){
    const f = t.files && t.files[0];
    if(f) readImage(f, d=>{
      FORM_CONSIGN_IMG = d;
      const p = document.getElementById('cs-prev');
      if(p){ p.src=d; p.style.display='block'; }
      const b = document.querySelector('[data-action="consign-img-clear"]');
      if(b) b.style.display='inline-flex';
    });
    t.value='';
  }else if(t.id==='imp-file'){
    const f = t.files && t.files[0];
    if(f) importData(f);
    t.value='';
  }
});
/* 输入框实时触发（商品搜索 / 快递搜索） */
document.addEventListener('input', e=>{
  const t = e.target;
  const act = t && t.getAttribute && t.getAttribute('data-action');
  if(act==='prod-search-live'){
    PS.q = t.value;
    const list = prodFiltered();
    const g = document.getElementById('prod-grid');
    if(g) g.innerHTML = prodGridHtml(list);
    const c = document.getElementById('prod-count');
    if(c) c.textContent = fmtCount(t('productsCount'),{n:list.length});
  }
  else if(act==='parcel-search'){ PA.q = t.value; render(); }
  else if(act==='plist-search'){ PL.q = t.value; PL.page = 1;
    const wrap = document.querySelector('.admin-panel .panel-head');
    // 局部重渲染列表区域，避免输入框失焦
    const card = t.closest('.admin-panel');
    if(card){
      const html = publicParcelList();
      card.outerHTML = html;
      const ni = document.getElementById('plist-search');
      if(ni){ ni.focus(); ni.setSelectionRange(ni.value.length, ni.value.length); }
    }
  }
});
window.addEventListener('hashchange', render);
window.addEventListener('scroll', ()=>{ window.__SM_SCROLL = window.scrollY||0; }, {passive:true});

/* ===== 启动 ===== */
load();
render();
applyTheme();

/* ===== PWA：部署到 https 后注册 service worker，支持添加到主屏幕 ===== */
(function(){
  try{
    if('serviceWorker' in navigator){
      if(location.protocol==='https:'){
        navigator.serviceWorker.register('sw.js').catch(function(){});
      }
      // 新版 SW 一接管就自动刷新一次，确保用户拿到最新页面（清掉旧缓存行为）
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if(!refreshing){ refreshing = true; location.reload(); }
      });
    }
  }catch(e){}
})();

/* ===== 白天 / 夜晚主题 ===== */
function applyTheme(){
  try{
    const day = S.settings.theme==='day';
    document.body.classList.toggle('day', day);
    document.body.classList.toggle('night', !day);
    if(window.__setBgMode) window.__setBgMode(day?'day':'night');
  }catch(e){}
}

/* ===== 动态背景：夜晚星空 + 流星；白天柔和风景 ===== */
(function(){
  if(typeof window==='undefined' || !window.requestAnimationFrame || !document.createElement) return;
  try{
    const c=document.createElement('canvas');
    c.id='starfield';
    document.body.appendChild(c);
    const ctx=c.getContext('2d');
    if(!ctx) return;
    let mode='night', stars=[], clouds=[], shooting=[], w=0, h=0;
    function initStars(){
      const n=Math.min(420,Math.floor(w*h/2100));
      stars=[];
      for(let i=0;i<n;i++){
        stars.push({x:Math.random()*w, y:Math.random()*h,
          r:Math.random()*1.3+0.3, p:Math.random()*Math.PI*2, s:Math.random()*0.03+0.006});
      }
    }
    function initClouds(){
      clouds=[];
      const n=6;
      for(let i=0;i<n;i++){
        clouds.push({x:Math.random()*w, y:Math.random()*h*0.26+16,
          s:0.6+Math.random()*0.9, v:0.15+Math.random()*0.25, o:0.35+Math.random()*0.3});
      }
    }
    function resize(){
      w=c.width=window.innerWidth; h=c.height=window.innerHeight;
      initStars(); initClouds();
    }
    window.addEventListener('resize',resize); resize();
    window.__setBgMode=function(m){ mode=m; shooting=[]; };
    if(S.settings && S.settings.theme==='day'){ mode='day'; }
    function drawCloud(cl){
      ctx.globalAlpha=cl.o;
      ctx.fillStyle='#ffffff';
      ctx.beginPath();
      ctx.ellipse(cl.x, cl.y, 70*cl.s, 22*cl.s, 0, 0, Math.PI*2);
      ctx.ellipse(cl.x-40*cl.s, cl.y+6*cl.s, 45*cl.s, 16*cl.s, 0, 0, Math.PI*2);
      ctx.ellipse(cl.x+42*cl.s, cl.y+5*cl.s, 48*cl.s, 17*cl.s, 0, 0, Math.PI*2);
      ctx.fill();
    }
    function loop(){
      ctx.clearRect(0,0,w,h);
      if(mode==='night'){
        for(let i=0;i<stars.length;i++){
          const s=stars[i]; s.p+=s.s;
          ctx.globalAlpha=0.35+Math.abs(Math.sin(s.p))*0.55;
          ctx.fillStyle='#dce8ff';
          ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha=1;
        if(shooting.length<4 && Math.random()<0.03){
          shooting.push({x:Math.random()*w*0.7+w*0.3, y:Math.random()*h*0.35,
            vx:-(5+Math.random()*5), vy:2.5+Math.random()*2, life:1});
        }
        for(let i=shooting.length-1;i>=0;i--){
          const sh=shooting[i];
          sh.x+=sh.vx; sh.y+=sh.vy; sh.life-=0.014;
          const tx=sh.x-sh.vx*14, ty=sh.y-sh.vy*14;
          const g=ctx.createLinearGradient(sh.x,sh.y,tx,ty);
          g.addColorStop(0,'rgba(255,255,255,'+Math.max(0,sh.life)+')');
          g.addColorStop(1,'rgba(255,255,255,0)');
          ctx.strokeStyle=g; ctx.lineWidth=1.6; ctx.lineCap='round';
          ctx.beginPath(); ctx.moveTo(sh.x,sh.y); ctx.lineTo(tx,ty); ctx.stroke();
          if(sh.life<=0 || sh.y>h || sh.x<0) shooting.splice(i,1);
        }
      }else{
        // 白天：柔太阳
        const sx=w*0.82, sy=h*0.18, sr=46;
        const glow=ctx.createRadialGradient(sx,sy,0,sx,sy,sr*3);
        glow.addColorStop(0,'rgba(255,247,214,0.95)');
        glow.addColorStop(0.4,'rgba(255,236,170,0.45)');
        glow.addColorStop(1,'rgba(255,236,170,0)');
        ctx.globalAlpha=1; ctx.fillStyle=glow;
        ctx.beginPath(); ctx.arc(sx,sy,sr*3,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#FFF3C4';
        ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2); ctx.fill();
        // 缓坡
        ctx.fillStyle='rgba(168,206,160,0.55)';
        ctx.beginPath(); ctx.moveTo(0,h);
        ctx.bezierCurveTo(w*0.25,h*0.86, w*0.6,h*0.95, w,h*0.88);
        ctx.lineTo(w,h); ctx.closePath(); ctx.fill();
        ctx.fillStyle='rgba(140,186,140,0.5)';
        ctx.beginPath(); ctx.moveTo(0,h);
        ctx.bezierCurveTo(w*0.3,h*0.93, w*0.7,h*0.84, w,h*0.96);
        ctx.lineTo(w,h); ctx.closePath(); ctx.fill();
        // 慢飘云
        for(let i=0;i<clouds.length;i++){
          const cl=clouds[i];
          cl.x+=cl.v;
          if(cl.x-cl.s*120>w){ cl.x=-cl.s*120; cl.y=Math.random()*h*0.26+16; }
          drawCloud(cl);
        }
        ctx.globalAlpha=1;
      }
      requestAnimationFrame(loop);
    }
    loop();
  }catch(e){}
})();
</script>
